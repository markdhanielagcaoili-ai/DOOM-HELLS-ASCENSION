<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DOOM: HELL'S ASCENSION — Unity 6 Tactical FPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060506;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #f0e6d2;
      user-select: none;
    }
    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #060506;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #060506;
      outline: none;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, rgba(165, 68, 16, 0.34), rgba(6, 5, 6, 0.98) 68%);
      z-index: 20;
      transition: opacity 0.45s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .brand-title {
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      font-weight: 900;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      background: linear-gradient(180deg, #fff1be 0%, #d8b35e 52%, #8e6622 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.9));
      margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.36em;
      color: #e2c98d;
      margin-bottom: 34px;
    }
    .bar-track {
      width: min(440px, 80vw);
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(218, 178, 92, 0.45);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #c93818 0%, #f0b949 100%);
      transition: width 0.12s linear;
    }
    #loading-text {
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      color: #cbb894;
      text-transform: uppercase;
    }
    #fs-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 15;
      background: rgba(14, 11, 10, 0.82);
      border: 1px solid rgba(220, 180, 92, 0.55);
      color: #f4d88c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    #fs-btn:hover {
      background: rgba(180, 118, 32, 0.45);
    }
    #fs-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-overlay">
    <div class="brand-title">DOOM</div>
    <div class="brand-sub">HELL'S ASCENSION</div>
    <div class="bar-track"><div id="bar-fill" class="bar-fill"></div></div>
    <div id="loading-text">LOADING UNITY 6 ENGINE... 0%</div>
  </div>

  <button id="fs-btn" title="Toggle Fullscreen">⛶ FULLSCREEN</button>

  <script src="Build/WebGLBuild.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const overlay = document.querySelector("#loading-overlay");
    const barFill = document.querySelector("#bar-fill");
    const loadText = document.querySelector("#loading-text");
    const fsBtn = document.querySelector("#fs-btn");

    const config = {
      arguments: [],
      dataUrl: "Build/WebGLBuild.data",
      frameworkUrl: "Build/WebGLBuild.framework.js",
      codeUrl: "Build/WebGLBuild.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Markdhaniel Agcaoili",
      productName: "DOOM: HELL'S ASCENSION",
      productVersion: "2.0",
      matchWebGLToCanvasSize: true
    };

    createUnityInstance(canvas, config, (progress) => {
      const pct = Math.min(100, Math.round(progress * 100));
      barFill.style.width = pct + "%";
      loadText.textContent = pct >= 90
        ? "INITIALIZING CITADEL ARENA... " + pct + "%"
        : "LOADING UNITY 6 ENGINE... " + pct + "%";
    }).then((unityInstance) => {
      barFill.style.width = "100%";
      overlay.classList.add("hidden");
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          unityInstance.SetFullscreen(1);
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    }).catch((err) => {
      loadText.textContent = "LOAD ERROR: " + err;
      loadText.style.color = "#ff6b4a";
    });

    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement) fsBtn.classList.add("hidden");
      else fsBtn.classList.remove("hidden");
    });
  </script>
</body>
</html>
