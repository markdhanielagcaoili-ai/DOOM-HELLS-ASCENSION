<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DOOM: HELL'S ASCENSION — Cinematic Hero & Unity 6 Tactical FPS</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120304'/%3E%3Crect x='3' y='3' width='58' height='58' rx='10' fill='none' stroke='%23dc2626' stroke-width='4'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Impact,Arial Black,sans-serif' font-size='42' font-weight='900' fill='%23ef4444'%3ED%3C/text%3E%3C/svg%3E" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Oswald:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040304;
      font-family: "Oswald", "Segoe UI", system-ui, sans-serif;
      color: #f3e8e2;
      user-select: none;
    }

    /* =====================================================================
       FULL-VIEWPORT 16:9 HARDWARE-ACCELERATED CINEMATIC HERO SECTION
       ===================================================================== */
    #hero-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040304;
      z-index: 30;
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.8s ease;
    }

    #hero-stage.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    #cinematic-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 1;
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 48%, rgba(8, 2, 3, 0.56) 100%),
        linear-gradient(180deg, rgba(8, 2, 3, 0.34) 0%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, 0) 74%, rgba(8, 2, 3, 0.62) 100%);
      z-index: 2;
    }

    /* =====================================================================
       CHISELED METALLIC BLOOD-RED & GLOWING CRIMSON TITLE TYPOGRAPHY
       ===================================================================== */
    #hero-title-wrap {
      position: absolute;
      top: clamp(18px, 4.4vh, 54px);
      left: 50%;
      width: min(880px, 90vw);
      transform: translate3d(-50%, -24px, 0) scale(0.92);
      opacity: 0;
      z-index: 5;
      pointer-events: none;
      will-change: transform, opacity, filter;
      filter: blur(10px) brightness(0.4);
      transition:
        opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1),
        transform 1.7s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #hero-title-wrap.revealed {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
      filter: blur(0px) brightness(1);
    }

    .title-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      filter:
        drop-shadow(0 10px 22px rgba(0, 0, 0, 0.96)) drop-shadow(0 0 28px rgba(220, 38, 38, 0.65)) drop-shadow(0 0 64px rgba(239, 68, 68, 0.36));
      animation: titleEmberPulse 4.2s ease-in-out infinite;
    }

    @keyframes titleEmberPulse {

      0%,
      100% {
        filter:
          drop-shadow(0 10px 22px rgba(0, 0, 0, 0.96)) drop-shadow(0 0 24px rgba(220, 38, 38, 0.62)) drop-shadow(0 0 56px rgba(239, 68, 68, 0.34));
      }

      50% {
        filter:
          drop-shadow(0 12px 26px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 36px rgba(239, 68, 68, 0.88)) drop-shadow(0 0 82px rgba(220, 38, 38, 0.52));
      }
    }

    .svg-main-doom {
      font-family: "Cinzel", Impact, "Arial Black", serif;
      font-weight: 900;
      letter-spacing: 0.22em;
    }

    .svg-sub-ascension {
      font-family: "Oswald", "Arial Narrow", Impact, sans-serif;
      font-weight: 700;
      letter-spacing: 0.44em;
    }

    .title-flame-rule {
      width: min(520px, 64vw);
      height: 2px;
      margin: 4px auto 0;
      background: linear-gradient(90deg, rgba(220, 38, 38, 0) 0%, #dc2626 24%, #ff6b4a 50%, #dc2626 76%, rgba(220, 38, 38, 0) 100%);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.85);
      opacity: 0.92;
    }

    /* =====================================================================
       COMPACT RED 3-BUTTON VERTICAL PILL MENU ON LANDING PAGE (Pic 1 Style!)
       Play / Armory Shop / Settings — Maliit lang na box, sleek & animated!
       ===================================================================== */
    #landing-menu-stack {
      position: absolute;
      left: clamp(24px, 3.6vw, 56px);
      bottom: clamp(28px, 5.2vh, 56px);
      width: 268px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      z-index: 8;
      opacity: 0;
      transform: translate3d(-24px, 14px, 0) scale(0.94);
      pointer-events: none;
      transition:
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #landing-menu-stack.visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }

    .pill-btn {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0 18px;
      cursor: pointer;
      outline: none;
      text-align: left;
      transition:
        transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease;
    }

    .pill-btn:hover {
      transform: translateX(8px) scale(1.03);
    }

    .pill-btn:active {
      transform: translateX(4px) scale(0.97);
    }

    /* Primary Blood-Red "Play" Pill (Replaces Spawn) */
    .pill-play {
      height: 58px;
      border-radius: 20px 20px 10px 10px;
      border: 2px solid #2b0607;
      background: linear-gradient(180deg, #f03835 0%, #c81b1b 52%, #8e0f12 100%);
      color: #120202;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.82),
        0 0 26px rgba(220, 38, 38, 0.55),
        inset 0 2px 0 rgba(255, 195, 185, 0.55);
    }

    .pill-play:hover {
      background: linear-gradient(180deg, #ff4b45 0%, #dc2626 52%, #a61418 100%);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.88),
        0 0 38px rgba(239, 68, 68, 0.85),
        inset 0 2px 0 rgba(255, 220, 210, 0.72);
    }

    /* Translucent Deep Crimson Pills matching the red apocalyptic landing page (no flat black!) */
    .pill-dark {
      height: 48px;
      border-radius: 10px;
      border: 1.5px solid rgba(220, 56, 52, 0.65);
      background: linear-gradient(180deg, rgba(84, 16, 18, 0.82) 0%, rgba(40, 8, 10, 0.88) 100%);
      backdrop-filter: blur(6px);
      color: #ffffff;
      box-shadow:
        0 6px 18px rgba(24, 3, 4, 0.65),
        inset 0 1px 0 rgba(255, 160, 150, 0.25);
    }

    .pill-dark:last-of-type {
      border-radius: 10px 10px 18px 18px;
    }

    .pill-dark:hover {
      border-color: #ef4444;
      background: linear-gradient(180deg, rgba(145, 24, 26, 0.92) 0%, rgba(72, 12, 14, 0.95) 100%);
      box-shadow:
        0 8px 24px rgba(24, 3, 4, 0.78),
        0 0 24px rgba(220, 38, 38, 0.55);
    }

    .pill-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pill-divider {
      width: 1.5px;
      height: 54%;
      margin: 0 15px 0 13px;
      flex-shrink: 0;
    }

    .pill-play .pill-divider {
      background: rgba(255, 225, 215, 0.65);
    }

    .pill-dark .pill-divider {
      background: rgba(210, 185, 185, 0.45);
    }

    .pill-text {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .pill-play .pill-text {
      font-size: 1.55rem;
    }

    .pill-dark .pill-text {
      font-size: 1.2rem;
    }

    .engine-pill-status {
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(52, 10, 12, 0.72);
      border: 1px solid rgba(220, 56, 52, 0.45);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: #f3cbc5;
    }

    .engine-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      display: inline-block;
      margin-right: 6px;
    }

    .engine-dot.ready {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* =====================================================================
       COMPACT ANIMATED SPRING POP-UP BOX (Pic 4 Choose Mode -> Pic 5 Playstyle -> Shop/Settings)
       ===================================================================== */
    #popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 1, 2, 0.56);
      backdrop-filter: blur(3px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    #popup-backdrop.open {
      display: flex;
      animation: backdropFade 0.22s ease forwards;
    }

    @keyframes backdropFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .popup-box {
      width: min(415px, 92vw);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(16, 10, 12, 0.97) 0%, rgba(8, 5, 7, 0.99) 100%);
      border: 1.5px solid rgba(220, 38, 38, 0.75);
      border-radius: 14px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.92),
        0 0 40px rgba(220, 38, 38, 0.28);
      overflow: hidden;
      transform-origin: center center;
      animation: springPopIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes springPopIn {
      0% {
        opacity: 0;
        transform: scale(0.82) translateY(20px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Pic 4 & Pic 5 Signature Crimson Header: Icon + Title + Arrow Line + Red [X] */
    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(220, 38, 38, 0.28);
      background: rgba(24, 9, 11, 0.75);
    }

    .popup-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ef4444;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(220, 38, 38, 0.5);
    }

    .popup-arrow-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #dc2626 0%, #ef4444 100%);
      position: relative;
      margin: 0 4px;
    }

    .popup-arrow-line::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-top: 2px solid #ef4444;
      border-right: 2px solid #ef4444;
      transform: rotate(45deg);
    }

    .popup-close {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1.5px solid #3f0909;
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .popup-close:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .popup-body {
      padding: 12px 14px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .popup-body::-webkit-scrollbar {
      width: 5px;
    }

    .popup-body::-webkit-scrollbar-thumb {
      background: rgba(220, 38, 38, 0.65);
      border-radius: 4px;
    }

    /* Pic 4 Compact Visual Mode Cards (OP // 01, 02, 03) */
    .mode-card {
      position: relative;
      border-radius: 10px;
      border: 1.5px solid rgba(160, 45, 45, 0.45);
      background: #140c0e;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      padding: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .mode-card:hover,
    .mode-card.active {
      transform: scale(1.02);
      border-color: #ef4444;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.36);
    }

    .mode-card-head {
      padding: 6px 11px;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(90deg, rgba(165, 22, 24, 0.92) 0%, rgba(70, 12, 14, 0.92) 100%);
    }

    .mode-card:not(.active):not(:hover) .mode-card-head {
      background: linear-gradient(90deg, rgba(28, 19, 21, 0.96) 0%, rgba(14, 10, 11, 0.96) 100%);
    }

    .mode-card-thumb {
      position: relative;
      width: 100%;
      height: 82px;
      overflow: hidden;
      background: #090506;
    }

    .mode-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .mode-card:hover .mode-card-thumb img {
      transform: scale(1.06);
    }

    .mode-card-desc {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 4px 10px;
      background: linear-gradient(180deg, rgba(6, 2, 3, 0.1) 0%, rgba(6, 2, 3, 0.9) 100%);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: #f0d7d2;
    }

    /* Pic 5 Compact "> Option" Playstyle Rows (Easy / Medium / Hard) */
    .playstyle-meta {
      padding: 7px 11px;
      border-radius: 7px;
      background: rgba(120, 18, 22, 0.28);
      border: 1px solid rgba(220, 38, 38, 0.35);
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      color: #fca5a5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-row {
      width: 100%;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1.5px solid rgba(155, 50, 50, 0.42);
      background: linear-gradient(180deg, rgba(22, 15, 17, 0.96) 0%, rgba(10, 7, 8, 0.98) 100%);
      text-align: left;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .role-row:hover {
      transform: translateX(6px);
      border-color: #ef4444;
      background: linear-gradient(180deg, rgba(135, 22, 24, 0.92) 0%, rgba(56, 10, 12, 0.96) 100%);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35);
    }

    .role-row-title {
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: block;
    }

    .role-row-sub {
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: #e4c1bc;
      display: block;
      margin-top: 2px;
    }

    /* Compact Armory & Settings Controls inside Pop-Up Box */
    .compact-item {
      padding: 8px 11px;
      border-radius: 8px;
      background: rgba(24, 15, 17, 0.92);
      border: 1px solid rgba(185, 45, 45, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }

    .compact-btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid rgba(239, 68, 68, 0.65);
      background: linear-gradient(180deg, #dc2626 0%, #8f1114 100%);
      color: #ffffff;
      font-family: "Oswald", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .compact-btn:hover {
      transform: scale(1.03);
      filter: brightness(1.12);
    }

    .compact-btn.secondary {
      background: rgba(26, 17, 19, 0.95);
      border-color: rgba(200, 90, 90, 0.45);
      color: #f0d4cf;
    }

    .compact-slider {
      width: 100%;
      accent-color: #ef4444;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Discreet Skip Trigger During Opening 8s */
    #skip-intro-btn {
      position: absolute;
      right: 22px;
      bottom: 20px;
      z-index: 9;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(8, 5, 6, 0.62);
      color: rgba(235, 212, 204, 0.85);
      font-family: "Oswald", sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.2em;
      padding: 6px 14px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.4s ease, border-color 0.2s ease, color 0.2s ease;
    }

    #skip-intro-btn:hover {
      border-color: rgba(239, 68, 68, 0.8);
      color: #ffffff;
    }

    #skip-intro-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* =====================================================================
       UNITY 6 WEBGL FULLSCREEN GAME CONTAINER (PRELOADED SILENTLY BEHIND)
       ===================================================================== */
    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #060506;
      z-index: 10;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #060506;
      outline: none;
    }

    #fs-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 15;
      background: rgba(68, 12, 14, 0.78);
      border: 1px solid rgba(220, 52, 48, 0.72);
      color: #ffd0ca;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    #fs-btn:hover {
      background: rgba(185, 28, 28, 0.45);
    }

    #fs-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* =====================================================================
       DEMONIC GOD-WARRIOR BLOOD-ECLIPSE ANIMATED LOADING SCREEN
       ===================================================================== */
    #loading-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #020102;
      z-index: 60;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s ease;
    }
    #loading-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #loading-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }
    .loading-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(0, 0, 0, 0) 42%, rgba(4, 1, 2, 0.70) 100%),
        linear-gradient(180deg, rgba(4, 1, 2, 0.30) 0%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, 0) 68%, rgba(4, 1, 2, 0.88) 100%);
    }
    .loading-hud {
      position: absolute;
      left: clamp(24px, 4.5vw, 68px);
      right: clamp(24px, 4.5vw, 68px);
      bottom: clamp(22px, 4.2vh, 46px);
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 9px;
      pointer-events: none;
    }
    .loading-top-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .loading-title {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(1.05rem, 2.1vw, 1.65rem);
      letter-spacing: 0.22em;
      color: #fecaca;
      text-shadow: 0 2px 14px rgba(220, 38, 38, 0.85), 0 3px 6px rgba(0, 0, 0, 0.96);
    }
    .loading-status {
      font-family: "Oswald", sans-serif;
      font-size: clamp(0.78rem, 1.15vw, 0.96rem);
      letter-spacing: 0.18em;
      color: #fca5a5;
      text-transform: uppercase;
    }
    .loading-pct {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: clamp(1.15rem, 2vw, 1.7rem);
      letter-spacing: 0.1em;
      color: #fde68a;
      text-shadow: 0 0 18px rgba(245, 158, 11, 0.75);
    }
    .loading-bar-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);

</head>

  <!-- COMPACT ANIMATED POP-UP BOXES (Choose Mode -> Choose Playstyle / Armory Shop / Settings) -->

  <script src="Build/WebGLBuild.loader.js"></script>
  <script>
    (() => {
      // =========================================================================
      // 1. LIVE SHADOW ARMY WALLPAPER VIDEO + SPECTRAL MANA PARTICLES
      // =========================================================================
      const heroStage = document.getElementById("hero-stage");
      const heroVideo = document.getElementById("hero-video");
      const cineCanvas = document.getElementById("cinematic-canvas");
      const ctx = cineCanvas.getContext("2d");
      const popupBackdrop = document.getElementById("popup-backdrop");
      const popupRoot = document.getElementById("popup-box-root");
      const engineDot = document.getElementById("engine-dot");
      const engineStatusText = document.getElementById("engine-status-text");

      const HERO_VIDEO_SPEED = 0.72;
      let savedHeroVideoTime = 0;

      function lockHeroVideoSpeed() {
        if (!heroVideo) return;
        heroVideo.defaultPlaybackRate = HERO_VIDEO_SPEED;
        if (Math.abs(heroVideo.playbackRate - HERO_VIDEO_SPEED) > 0.01) {
          heroVideo.playbackRate = HERO_VIDEO_SPEED;
        }
      }

      if (heroVideo) {
        heroVideo.muted = true;
        lockHeroVideoSpeed();
        heroVideo.addEventListener("loadedmetadata", lockHeroVideoSpeed);
        heroVideo.addEventListener("play", lockHeroVideoSpeed);
        heroVideo.addEventListener("ratechange", lockHeroVideoSpeed);
        heroVideo.play().catch(() => { });
        window.addEventListener("pointerdown", () => {
          if (heroActive && !document.hidden && heroVideo.paused) {
            lockHeroVideoSpeed();
            heroVideo.play().catch(() => { });
          }
        }, { once: true });
      }

      // Prevent browser video fast-forward catch-up burst when switching tabs!
      let resumeVideoTimer = null;
      document.addEventListener("visibilitychange", () => {
        if (!heroVideo) return;
        if (resumeVideoTimer) { clearTimeout(resumeVideoTimer); resumeVideoTimer = null; }
        if (document.hidden) {
          savedHeroVideoTime = heroVideo.currentTime || 0;
          if (!heroVideo.paused) heroVideo.pause();
        } else {
          lastFrameTs = performance.now();
          if (heroActive) {
            if (!heroVideo.paused) heroVideo.pause();
            resumeVideoTimer = setTimeout(() => {
              resumeVideoTimer = null;
              if (document.hidden || !heroActive) return;
              if (Number.isFinite(savedHeroVideoTime)) {
                try { heroVideo.currentTime = savedHeroVideoTime; } catch (_) { }
              }
              lockHeroVideoSpeed();
              heroVideo.play().catch(() => { });
            }, 60);
          }
        }
      });

      let cw = 1920, ch = 1080;
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cw = Math.max(1, Math.floor(window.innerWidth * dpr));
        ch = Math.max(1, Math.floor(window.innerHeight * dpr));
        cineCanvas.width = cw;
        cineCanvas.height = ch;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const manaSparks = Array.from({ length: 64 }, (_, i) => ({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.009, vy: -(0.014 + Math.random() * 0.036),
        size: 1.4 + Math.random() * 3.4, phase: Math.random() * Math.PI * 2, cyan: i % 3 !== 0
      }));

      let heroActive = true;
      let lastFrameTs = performance.now();
      let heroSimTime = 0;

      function renderHero(now) {
        if (!heroActive) return;
        requestAnimationFrame(renderHero);

        if (document.hidden) {
          lastFrameTs = now;
          return;
        }

        const dt = Math.min(0.033, Math.max(0, (now - lastFrameTs) / 1000));
        lastFrameTs = now;
        heroSimTime += dt;
        const t = heroSimTime;

        ctx.clearRect(0, 0, cw, ch);
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < manaSparks.length; i++) {
          const e = manaSparks[i];
          e.x += (e.vx + Math.sin(t * 1.1 + e.phase) * 0.005) * dt;
          e.y += e.vy * dt;
          if (e.y < -0.05) { e.y = 1.05; e.x = Math.random(); }
          if (e.x > 1.05) e.x = -0.04;
          if (e.x < -0.05) e.x = 1.04;
          const ex = e.x * cw, ey = e.y * ch;
          const flicker = 0.45 + 0.55 * Math.sin(t * 2.4 + e.phase);
          const r = e.size * (cw / 1920) * (0.85 + 0.3 * flicker);
          const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 3.4);
          if (e.cyan) {
            eg.addColorStop(0, `rgba(255, 224, 148, ${(0.88 * flicker).toFixed(3)})`);
            eg.addColorStop(0.42, `rgba(255, 118, 36, ${(0.56 * flicker).toFixed(3)})`);
            eg.addColorStop(1, "rgba(220, 32, 16, 0)");
          } else {
            eg.addColorStop(0, `rgba(255, 152, 92, ${(0.84 * flicker).toFixed(3)})`);
            eg.addColorStop(0.42, `rgba(232, 42, 24, ${(0.50 * flicker).toFixed(3)})`);
            eg.addColorStop(1, "rgba(148, 16, 12, 0)");
          }
          ctx.fillStyle = eg;
          ctx.beginPath();
          ctx.arc(ex, ey, r * 3.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      requestAnimationFrame(renderHero);

      // =========================================================================
      // 2. COMPACT SPRING-ANIMATED POP-UP CONTROLLER (Pic 4 -> Pic 5 / Shop / Settings)
      // =========================================================================
      let selectedMode = "Campaign";
      let webAudioMuted = false;
      let webSensitivity = 1.0;
      let pendingLaunch = null;
      let pendingShopOpen = false;

      const pinSvg = `<svg viewBox="0 0 24 24" width="22" height="22" fill="#ef4444"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>`;

      function openPopupHtml(title, innerHtml) {
        popupRoot.style.animation = "none";
        popupRoot.innerHTML = `
          <div class="popup-header">
            ${pinSvg}
            <span class="popup-title">${title}</span>
            <span class="popup-arrow-line"></span>
            <button class="popup-close" id="popup-close-btn" title="Close">✕</button>
          </div>
          <div class="popup-body">${innerHtml}</div>
        `;
        popupBackdrop.classList.add("open");
        void popupRoot.offsetWidth;
        popupRoot.style.animation = "";
        document.getElementById("popup-close-btn").addEventListener("click", closePopup);
      }

      function closePopup() {
        popupBackdrop.classList.remove("open");
      }
      popupBackdrop.addEventListener("click", (e) => { if (e.target === popupBackdrop) closePopup(); });
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closePopup(); });

      // STEP 1 POP-UP: Pic 4 "Choose Mode" with Pic 3's 3 Modes
      function openChooseModePopup() {
        openPopupHtml("Choose Mode", `
          <button class="mode-card active" data-mode="Campaign">
            <div class="mode-card-head">&gt; OP // 01  CAMPAIGN (100 LEVELS)</div>
            <div class="mode-card-thumb">
              <img src="assets/hero/loading_god_warrior.jpg?v=2" alt="Campaign" />
              <div class="mode-card-desc">Sequential Level 1 → 100 · 10 Unique Realm Bosses · Acid Demons</div>
            </div>
          </button>
          <button class="mode-card" data-mode="EndlessHorde">
            <div class="mode-card-head">&gt; OP // 02  ENDLESS HORDE</div>
            <div class="mode-card-thumb">
              <img src="assets/hero/loading_god_warrior.jpg?v=2" alt="Endless Horde" />
              <div class="mode-card-desc">Infinite Escalating Waves · Unique Realm Boss every 3rd Wave</div>
            </div>
          </button>
          <button class="mode-card" data-mode="PurgatoryBlitz">
            <div class="mode-card-head">&gt; OP // 03  PURGATORY BLITZ</div>
            <div class="mode-card-thumb">
              <img src="assets/hero/loading_god_warrior.jpg?v=2" alt="Purgatory Blitz" />
              <div class="mode-card-desc">150s Doomsday Clock (+2.5s / Kill) across unlocked levels</div>
            </div>
          </button>
        `);
        popupRoot.querySelectorAll(".mode-card").forEach((card) => {
          card.addEventListener("click", () => {
            selectedMode = card.getAttribute("data-mode");
            openChoosePlaystylePopup();
          });
        });
      }

      // STEP 2 POP-UP: Pic 5 "Choose Playstyle" -> Easy / Medium / Hard
      function openChoosePlaystylePopup() {
        const modeTitle = selectedMode === "Campaign" ? "OP // 01 CAMPAIGN"
          : selectedMode === "EndlessHorde" ? "OP // 02 ENDLESS HORDE"
            : "OP // 03 PURGATORY BLITZ";
        openPopupHtml("Choose Playstyle", `
          <div class="playstyle-meta">
            <span>MODE: ${modeTitle}</span>
            <span>${unityReady ? "READY TO DEPLOY" : "PRELOADING..."}</span>
          </div>
          <button class="role-row" data-diff="0.75">
            <span class="role-row-title">&gt; Easy</span>
            <span class="role-row-sub">0.75x Threat · Balanced Demon HP &amp; Acid Damage · New Slayers</span>
          </button>
          <button class="role-row" data-diff="1.0">
            <span class="role-row-title">&gt; Medium</span>
            <span class="role-row-sub">1.00x Threat · Standard Citadel Combat · Authentic DOOM Pace</span>
          </button>
          <button class="role-row" data-diff="1.45">
            <span class="role-row-title">&gt; Hard</span>
            <span class="role-row-sub">1.45x Threat · Brutal Acid Corrosion &amp; Relentless Bosses</span>
          </button>
          <div style="display:flex;justify-content:flex-start;margin-top:2px;">
            <button id="btn-back-modes" class="compact-btn secondary">← Back to Modes</button>
          </div>
        `);
        document.getElementById("btn-back-modes").addEventListener("click", openChooseModePopup);
        popupRoot.querySelectorAll(".role-row").forEach((row) => {
          row.addEventListener("click", () => {
            const diff = row.getAttribute("data-diff");
            launchIntoUnity(selectedMode, diff);
          });
        });
      }

      // COMPACT ARMORY SHOP POP-UP
      function openArmoryPopup() {
        openPopupHtml("Armory Shop", `
          <div class="compact-item"><span>REAVER VANDAL &amp; INFERNO PHANTOM</span><span style="color:#fca5a5">RIFLES [1-2]</span></div>
          <div class="compact-item"><span>HELL-JUDGE &amp; SOUL-SHREDDER ODIN</span><span style="color:#fca5a5">HEAVY [3-4]</span></div>
          <div class="compact-item"><span>REAVER OPERATOR SNIPER + SCOPE</span><span style="color:#fca5a5">SNIPER [5]</span></div>
          <div class="compact-item"><span>KARAMBIT / KATANA / CHAINSWORD / WARHAMMER</span><span style="color:#fca5a5">EQUIP [0]</span></div>
          <button id="btn-enter-shop" class="compact-btn" style="width:100%;padding:11px;">
            ${unityReady ? "▶ OPEN LIVE ARMORY SHOP [B]" : "⏳ LOADING UNITY ARMORY..."}
          </button>
        `);
        document.getElementById("btn-enter-shop").addEventListener("click", (e) => {
          if (unityReady && unityInst) {
            closePopup();
            dismissHero();
            unityInst.SendMessage("GameManager", "OpenShopFromWeb", "");
          } else {
            pendingShopOpen = true;
            e.target.textContent = "⏳ LOADING ENGINE — OPENING SHOP...";
          }
        });
      }

      // COMPACT SETTINGS POP-UP
      function openSettingsPopup() {
        openPopupHtml("Settings", `
          <div class="compact-item">
            <span>MASTER AUDIO &amp; GUN SFX</span>
            <button id="btn-set-audio" class="compact-btn ${webAudioMuted ? "secondary" : ""}">${webAudioMuted ? "MUTED" : "ENABLED"}</button>
          </div>
          <div class="compact-item" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;">
              <span>MOUSE AIM SENSITIVITY</span>
              <span id="sens-val-label" style="color:#fca5a5">${webSensitivity.toFixed(2)}x</span>
            </div>
            <input id="sens-slider" class="compact-slider" type="range" min="0.4" max="2.5" step="0.05" value="${webSensitivity}" />
          </div>
          <div class="compact-item">
            <span>CAMPAIGN PROGRESS</span>
            <button id="btn-set-reset" class="compact-btn secondary">RESET TO LVL 1</button>
          </div>
          <div style="font-size:0.70rem;color:#c9a9a3;text-align:center;line-height:1.45;">
            [WASD] Move · [MOUSE] Aim · [LMB] Fire/Slash · [RMB] ADS/Heavy · [1-5] Guns · [0] Knife<br/>
            [R] Reload · [Y] Inspect/Spin · [SHIFT] Dash · [B] Shop
          </div>
        `);
        document.getElementById("btn-set-audio").addEventListener("click", (e) => {
          webAudioMuted = !webAudioMuted;
          e.target.textContent = webAudioMuted ? "MUTED" : "ENABLED";
          e.target.classList.toggle("secondary", webAudioMuted);
          syncWebSettingsToUnity();
        });
        document.getElementById("sens-slider").addEventListener("input", (e) => {
          webSensitivity = parseFloat(e.target.value);
          document.getElementById("sens-val-label").textContent = webSensitivity.toFixed(2) + "x";
          syncWebSettingsToUnity();
        });
        document.getElementById("btn-set-reset").addEventListener("click", (e) => {
          if (unityReady && unityInst) unityInst.SendMessage("GameManager", "ResetProgressFromWeb", "");
          e.target.textContent = "RESET DONE!";
        });
      }

      document.getElementById("btn-menu-play").addEventListener("click", openChooseModePopup);
      document.getElementById("btn-menu-shop").addEventListener("click", openArmoryPopup);
      document.getElementById("btn-menu-settings").addEventListener("click", openSettingsPopup);

      function syncWebSettingsToUnity() {
        if (unityReady && unityInst) {
          unityInst.SendMessage("GameManager", "ApplyWebSettings", `${webSensitivity.toFixed(2)}|${webAudioMuted ? 1 : 0}`);
        }
      }

      let heroDismissTimer = null;

      function dismissHero() {
        if (heroDismissTimer) { clearTimeout(heroDismissTimer); heroDismissTimer = null; }
        heroStage.classList.add("dismissed");
        heroDismissTimer = setTimeout(() => {
          heroDismissTimer = null;
          heroActive = false;
          if (heroVideo && !heroVideo.paused) heroVideo.pause();
        }, 850);
      }

      function restoreHero() {
        if (heroDismissTimer) { clearTimeout(heroDismissTimer); heroDismissTimer = null; }
        heroStage.classList.remove("dismissed");
        if (!heroActive) {
          heroActive = true;
          lastFrameTs = performance.now();
          requestAnimationFrame(renderHero);
        }
        if (heroVideo && heroVideo.paused && !document.hidden) {
          lockHeroVideoSpeed();
          heroVideo.play().catch(() => { });
        }
      }

      function launchIntoUnity(mode, diff) {
        pendingShopOpen = false;
        closePopup();
        const label = mode === "EndlessHorde" ? "ENDLESS HORDE"
                    : mode === "PurgatoryBlitz" ? "PURGATORY BLITZ"
                    : "CAMPAIGN CITADEL";
        const diffNum = parseFloat(diff);
        const diffLabel = diffNum <= 0.8 ? "EASY" : diffNum >= 1.3 ? "HARD" : "MEDIUM";
        startGodWarriorLoadingScreen(`${label} · ${diffLabel}`, () => {
          syncWebSettingsToUnity();
          if (unityInst) unityInst.SendMessage("GameManager", "LaunchFromWebHero", `${mode}|${diff}`);
        });
      }

      // Called from Unity WebGL whenever the player backs out / dies and presses Back to Main Menu!
      window.doomReturnToMainMenu = () => {
        pendingShopOpen = false;
        closePopup();
        if (document.pointerLockElement && document.exitPointerLock) {
          try { document.exitPointerLock(); } catch (_) { }
        }
        startGodWarriorLoadingScreen("MAIN MENU", () => {
          restoreHero();
        }, { isReturn: true });
      };

      // Called from Unity WebGL when closing Armory Shop back to the Main Menu (no loading screen)
      window.doomRestoreMainMenuDirect = () => {
        pendingShopOpen = false;
        closePopup();
        if (document.pointerLockElement && document.exitPointerLock) {
          try { document.exitPointerLock(); } catch (_) { }
        }
        restoreHero();
      };

      // =========================================================================
      // 2.5. GOD WARRIOR DEMONIC BLOOD-ECLIPSE 60FPS ANIMATED LOADING SCREEN
      // Matching pin.it/5moNg2A7a: tumbling crimson leaves, rippling blood-moon lake,
      // rolling volcanic ash mist, pulsing eclipse corona & God-Warrior celestial halo!
      // =========================================================================
      const loadScreenEl = document.getElementById("loading-screen");
      const loadCanvas = document.getElementById("loading-canvas");
      const lctx = loadCanvas.getContext("2d", { alpha: false });
      const loadTitleEl = document.getElementById("loading-title");
      const loadStatusEl = document.getElementById("loading-status");
      const loadPctEl = document.getElementById("loading-pct");
      const loadBarFill = document.getElementById("loading-bar-fill");
      const loadTipEl = document.getElementById("loading-tip");

      const loadTips = [
        "TIP: Press [0] to spin-draw your Reaver Karambit · [LMB] Slash · [RMB] Heavy Stab · [Y] Spin Inspect",
        "TIP: Reaver Vandal deals 4x Headshot damage and unleashes the Soul-Pillar Finisher on Boss & final kills",
        "TIP: Watch out for flying & leaping demons — dodge their toxic acid spit before corrosion drains your HP",
        "TIP: Clear 100% of hostiles to unseal the Golden Ascension Portal and unlock the next Campaign Level",
        "TIP: Press [SHIFT] to Phase-Dash through demon swarms and [Q/E] at 100% Resonance for Overdrive"
      ];
      const loadStages = [
        "AWAKENING GOD WARRIOR...",
        "IGNITING BLOOD ECLIPSE...",
        "FORGING REAVER ARSENAL...",
        "UNSEALING DEMONIC CITADEL...",
        "ENTERING BATTLEFIELD..."
      ];
      const returnLoadStages = [
        "EXITING DEMONIC CITADEL...",
        "SEALING BLOOD ECLIPSE...",
        "RECALLING SHADOW ARMY...",
        "RESTORING COMMAND SANCTUM...",
        "ENTERING MAIN MENU..."
      ];

      const loadBgImg = new Image();
      loadBgImg.decoding = "async";
      loadBgImg.src = "assets/hero/loading_god_warrior.jpg?v=2";

      let lcw = 1920, lch = 1080;
      function resizeLoadCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        lcw = Math.max(1, Math.floor(window.innerWidth * dpr));
        lch = Math.max(1, Math.floor(window.innerHeight * dpr));
        loadCanvas.width = lcw;
        loadCanvas.height = lch;
      }
      window.addEventListener("resize", resizeLoadCanvas);
      resizeLoadCanvas();

      // 3D-tumbling crimson demon leaves/petals matching reference video 0:02-0:07!
      const bloodLeaves = Array.from({ length: 42 }, (_, i) => ({
        x: Math.random() * 1.15 - 0.1,
        y: Math.random() * 0.85,
        vx: 0.032 + Math.random() * 0.055,
        vy: 0.014 + Math.random() * 0.032,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 2.8,
        tumble: Math.random() * Math.PI * 2,
        vtumble: 1.8 + Math.random() * 3.0,
        size: 6 + Math.random() * 11,
        bright: i % 3 === 0
      }));

      // Rolling volcanic silver-ash & crimson mist banks
      const valleyMist = Array.from({ length: 10 }, (_, i) => ({
        x: (i / 10) * 1.3 - 0.15,
        y: 0.56 + (i % 3) * 0.08,
        vx: 0.010 + (i % 4) * 0.004,
        rx: 0.22 + (i % 3) * 0.08,
        ry: 0.07 + (i % 2) * 0.035,
        crimson: i % 4 === 0,
        alpha: 0.10 + (i % 3) * 0.04
      }));

      let loadActive = false;
      let loadStartTs = 0;
      let loadLastTs = 0;
      let loadCallback = null;
      let loadMinDur = 2.8;
      let loadIsReturn = false;
      let unityLoadProgress = 0;

      function startGodWarriorLoadingScreen(modeName, onComplete, options = {}) {
        const wasActive = loadActive;
        loadIsReturn = !!options.isReturn;
        loadMinDur = loadIsReturn ? 4.4 : 2.8;
        loadCallback = onComplete;
        loadTitleEl.textContent = loadIsReturn ? `RETURNING // ${modeName}` : `DEPLOYING // ${modeName}`;
        loadStatusEl.textContent = loadIsReturn ? returnLoadStages[0] : loadStages[0];
        loadPctEl.textContent = "0%";
        loadBarFill.style.width = "0%";
        loadTipEl.textContent = loadTips[Math.floor(Math.random() * loadTips.length)];
        loadStartTs = performance.now();
        loadLastTs = loadStartTs;
        loadActive = true;
        loadScreenEl.classList.add("active");
        if (loadIsReturn) {
          // Pre-reveal the main menu silently behind the opaque loading screen so fade-out is seamless!
          setTimeout(() => { if (loadActive && loadIsReturn) restoreHero(); }, 480);
        } else {
          dismissHero();
        }
        if (!wasActive) requestAnimationFrame(renderLoadingScreen);
      }

      function renderLoadingScreen(now) {
        if (!loadActive) return;
        const dt = Math.min(0.05, (now - loadLastTs) / 1000);
        loadLastTs = now;
        const elapsed = (now - loadStartTs) / 1000;

        lctx.fillStyle = "#020102";
        lctx.fillRect(0, 0, lcw, lch);

        // 1. Draw DOOM Slayer & Hell Citadel scene with slow cinematic breathing zoom
        if (loadBgImg.complete && loadBgImg.naturalWidth > 0) {
          const imgA = loadBgImg.naturalWidth / loadBgImg.naturalHeight;
          const canA = lcw / lch;
          const baseW = canA > imgA ? lcw : lch * imgA;
          const baseH = canA > imgA ? lcw / imgA : lch;
          const zoom = 1.01 + Math.min(0.045, elapsed * 0.011) + Math.sin(elapsed * 0.7) * 0.004;
          const drawW = baseW * zoom;
          const drawH = baseH * zoom;
          const dx = (lcw - drawW) * 0.5;
          const dy = (lch - drawH) * 0.5;

          lctx.drawImage(loadBgImg, dx, dy, drawW, drawH);

          // 2. Pulsing Crucible Blade, Hell Citadel Furnace, Ascension Sky Beam & Slayer Visor Glows
          lctx.save();
          lctx.globalCompositeOperation = "screen";
          const bladePulse = 0.5 + 0.5 * Math.sin(elapsed * 3.0);
          const beamPulse = 0.5 + 0.5 * Math.sin(elapsed * 2.2 + 1.0);

          const bladeX = dx + drawW * 0.605;
          const bladeY = dy + drawH * 0.625;
          const bladeR = drawW * 0.105;
          const bg1 = lctx.createRadialGradient(bladeX, bladeY, bladeR * 0.08, bladeX, bladeY, bladeR);
          bg1.addColorStop(0, `rgba(255, 92, 42, ${(0.34 + 0.16 * bladePulse).toFixed(3)})`);
          bg1.addColorStop(0.5, `rgba(220, 28, 22, ${(0.14 + 0.08 * bladePulse).toFixed(3)})`);
          bg1.addColorStop(1, "rgba(0, 0, 0, 0)");
          lctx.fillStyle = bg1;
          lctx.fillRect(bladeX - bladeR, bladeY - bladeR, bladeR * 2, bladeR * 2);

          const citX = dx + drawW * 0.735;
          const citY = dy + drawH * 0.595;
          const citR = drawW * 0.125;
          const cg = lctx.createRadialGradient(citX, citY, citR * 0.1, citX, citY, citR);
          cg.addColorStop(0, `rgba(255, 68, 28, ${(0.24 + 0.13 * beamPulse).toFixed(3)})`);
          cg.addColorStop(0.5, `rgba(195, 22, 18, ${(0.10 + 0.06 * beamPulse).toFixed(3)})`);
          cg.addColorStop(1, "rgba(0, 0, 0, 0)");
          lctx.fillStyle = cg;
          lctx.fillRect(citX - citR, citY - citR, citR * 2, citR * 2);

          const skyX = dx + drawW * 0.742;
          const skyY = dy + drawH * 0.175;
          const skyR = drawW * 0.095;
          const sg = lctx.createRadialGradient(skyX, skyY, skyR * 0.06, skyX, skyY, skyR);
          sg.addColorStop(0, `rgba(186, 232, 255, ${(0.26 + 0.14 * beamPulse).toFixed(3)})`);
          sg.addColorStop(0.5, `rgba(96, 175, 255, ${(0.10 + 0.05 * beamPulse).toFixed(3)})`);
          sg.addColorStop(1, "rgba(0, 0, 0, 0)");
          lctx.fillStyle = sg;
          lctx.fillRect(skyX - skyR, skyY - skyR, skyR * 2, skyR * 2);

          const visX = dx + drawW * 0.512;
          const visY = dy + drawH * 0.345;
          const visR = drawW * 0.036;
          const vg = lctx.createRadialGradient(visX, visY, visR * 0.05, visX, visY, visR);
          vg.addColorStop(0, `rgba(120, 240, 255, ${(0.22 + 0.10 * bladePulse).toFixed(3)})`);
          vg.addColorStop(1, "rgba(0, 0, 0, 0)");
          lctx.fillStyle = vg;
          lctx.fillRect(visX - visR, visY - visR, visR * 2, visR * 2);
          lctx.restore();
        }

        // 3. Rolling Silver-Ash & Demonic Crimson Valley Mist
        lctx.save();
        lctx.globalCompositeOperation = "screen";
        for (let i = 0; i < valleyMist.length; i++) {
          const m = valleyMist[i];
          m.x += m.vx * dt;
          if (m.x > 1.25) m.x = -0.25;
          const mx = m.x * lcw, my = m.y * lch;
          const rx = m.rx * lcw, ry = m.ry * lch;
          lctx.save();
          lctx.translate(mx, my);
          lctx.scale(1, ry / Math.max(1, rx));
          const g = lctx.createRadialGradient(0, 0, 0, 0, 0, rx);
          if (m.crimson) {
            g.addColorStop(0, `rgba(210, 32, 22, ${m.alpha.toFixed(3)})`);
            g.addColorStop(1, "rgba(0,0,0,0)");
          } else {
            g.addColorStop(0, `rgba(195, 185, 190, ${(m.alpha * 0.72).toFixed(3)})`);
            g.addColorStop(1, "rgba(0,0,0,0)");
          }
          lctx.fillStyle = g;
          lctx.beginPath();
          lctx.arc(0, 0, rx, 0, Math.PI * 2);
          lctx.fill();
          lctx.restore();
        }
        lctx.restore();

        // 4. 3D-Tumbling Glowing Blood-Red Leaves & Embers
        for (let i = 0; i < bloodLeaves.length; i++) {
          const lf = bloodLeaves[i];
          lf.x += (lf.vx + Math.sin(elapsed * 1.9 + lf.tumble) * 0.015) * dt;
          lf.y += (lf.vy + Math.cos(elapsed * 2.3 + lf.tumble) * 0.010) * dt;
          lf.rot += lf.vrot * dt;
          lf.tumble += lf.vtumble * dt;
          if (lf.x > 1.08 || lf.y > 0.92) {
            lf.x = -0.05 + Math.random() * 0.36;
            lf.y = -0.04 + Math.random() * 0.42;
          }
          const lx = lf.x * lcw, ly = lf.y * lch;
          const sc = lf.size * (lcw / 1920);
          const flip = 0.28 + 0.72 * Math.abs(Math.cos(lf.tumble));
          lctx.save();
          lctx.translate(lx, ly);
          lctx.rotate(lf.rot);
          lctx.scale(1, flip);
          lctx.fillStyle = lf.bright ? "rgba(248, 56, 42, 0.92)" : "rgba(182, 20, 22, 0.85)";
          lctx.shadowColor = "rgba(239, 68, 68, 0.75)";
          lctx.shadowBlur = 10;
          lctx.beginPath();
          lctx.moveTo(-sc, 0);
          lctx.quadraticCurveTo(0, -sc * 0.65, sc, 0);
          lctx.quadraticCurveTo(0, sc * 0.65, -sc, 0);
          lctx.fill();
          lctx.restore();
        }

        // 5. Compute smooth unified progress (blends cinematic timer + real Unity WebGL preload progress!)
        const timeProg = Math.min(1, elapsed / loadMinDur);
        const engineProg = unityReady ? 1 : Math.min(0.94, unityLoadProgress);
        const shownProg = unityReady ? timeProg : Math.min(timeProg, engineProg);
        const pct = Math.min(100, Math.round(shownProg * 100));

        loadPctEl.textContent = `${pct}%`;
        loadBarFill.style.width = `${pct}%`;
        const activeStages = loadIsReturn ? returnLoadStages : loadStages;
        const stageIdx = Math.min(activeStages.length - 1, Math.floor(shownProg * activeStages.length));
        loadStatusEl.textContent = unityReady ? activeStages[stageIdx] : `LOADING UNITY 6 ENGINE (${Math.round(unityLoadProgress * 100)}%)...`;

        if (unityReady && elapsed >= loadMinDur + 0.25) {
          loadActive = false;
          const cb = loadCallback;
          loadCallback = null;
          if (cb) cb();
          loadScreenEl.classList.remove("active");
          return;
        }
        requestAnimationFrame(renderLoadingScreen);
      }

      // =========================================================================
      // 3. SEAMLESS BACKGROUND UNITY 6 WEBGL PRELOADER & HANDOFF
      // =========================================================================
      const unityCanvas = document.querySelector("#unity-canvas");
      const fsBtn = document.querySelector("#fs-btn");
      let unityReady = false;
      let unityInst = null;

      createUnityInstance(unityCanvas, {
        arguments: [],
        dataUrl: "Build/WebGLBuild.data",
        frameworkUrl: "Build/WebGLBuild.framework.js",
        codeUrl: "Build/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Markdhaniel Agcaoili",
        productName: "DOOM: HELL'S ASCENSION",
        productVersion: "2.3",
        matchWebGLToCanvasSize: true
      }, (progress) => {
        unityLoadProgress = progress;
        const pct = Math.min(100, Math.round(progress * 100));
        if (!unityReady) {
          engineStatusText.textContent = pct >= 90 ? `INITIALIZING ${pct}%` : `LOADING ENGINE ${pct}%`;
        }
      }).then((instance) => {
        unityInst = instance;
        unityReady = true;
        unityLoadProgress = 1;
        engineDot.classList.add("ready");
        engineStatusText.textContent = "ENGINE READY";
        syncWebSettingsToUnity();
        if (pendingShopOpen) {
          pendingShopOpen = false;
          closePopup();
          dismissHero();
          unityInst.SendMessage("GameManager", "OpenShopFromWeb", "");
        }
      }).catch((err) => {
        engineStatusText.textContent = "ENGINE ERROR";
        console.error(err);
      });

      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          if (unityInst) unityInst.SetFullscreen(1);
          else document.documentElement.requestFullscreen?.().catch(() => { });
        } else {
          document.exitFullscreen().catch(() => { });
        }
      });

      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement) fsBtn.classList.add("hidden");
        else fsBtn.classList.remove("hidden");
      });
    })();
  </script>
</body>
