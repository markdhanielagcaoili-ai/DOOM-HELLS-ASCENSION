<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DOOM: HELL'S ASCENSION — Cinematic Hero & Unity 6 Tactical FPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040304;
      font-family: "Oswald", "Segoe UI", system-ui, sans-serif;
      color: #f3e8e2;
      user-select: none;
    }

    /* =====================================================================
       FULL-VIEWPORT 16:9 HARDWARE-ACCELERATED CINEMATIC HERO SECTION
       ===================================================================== */
    #hero-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040304;
      z-index: 30;
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.8s ease;
    }
    #hero-stage.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #cinematic-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      will-change: transform;
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(0, 0, 0, 0) 50%, rgba(28, 5, 6, 0.42) 100%),
        linear-gradient(180deg, rgba(36, 6, 7, 0.34) 0%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, 0) 80%, rgba(34, 6, 7, 0.32) 100%);
      z-index: 2;
    }

    /* =====================================================================
       CHISELED METALLIC BLOOD-RED & GLOWING CRIMSON TITLE TYPOGRAPHY
       ===================================================================== */
    #hero-title-wrap {
      position: absolute;
      top: clamp(18px, 4.4vh, 54px);
      left: 50%;
      width: min(880px, 90vw);
      transform: translate3d(-50%, -24px, 0) scale(0.92);
      opacity: 0;
      z-index: 5;
      pointer-events: none;
      will-change: transform, opacity, filter;
      filter: blur(10px) brightness(0.4);
      transition:
        opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1),
        transform 1.7s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #hero-title-wrap.revealed {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
      filter: blur(0px) brightness(1);
    }

    .title-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      filter:
        drop-shadow(0 10px 22px rgba(0, 0, 0, 0.96))
        drop-shadow(0 0 28px rgba(220, 38, 38, 0.65))
        drop-shadow(0 0 64px rgba(239, 68, 68, 0.36));
      animation: titleEmberPulse 4.2s ease-in-out infinite;
    }
    @keyframes titleEmberPulse {
      0%, 100% {
        filter:
          drop-shadow(0 10px 22px rgba(0, 0, 0, 0.96))
          drop-shadow(0 0 24px rgba(220, 38, 38, 0.62))
          drop-shadow(0 0 56px rgba(239, 68, 68, 0.34));
      }
      50% {
        filter:
          drop-shadow(0 12px 26px rgba(0, 0, 0, 0.98))
          drop-shadow(0 0 36px rgba(239, 68, 68, 0.88))
          drop-shadow(0 0 82px rgba(220, 38, 38, 0.52));
      }
    }

    .svg-main-doom {
      font-family: "Cinzel", Impact, "Arial Black", serif;
      font-weight: 900;
      letter-spacing: 0.22em;
    }
    .svg-sub-ascension {
      font-family: "Oswald", "Arial Narrow", Impact, sans-serif;
      font-weight: 700;
      letter-spacing: 0.44em;
    }
    .title-flame-rule {
      width: min(520px, 64vw);
      height: 2px;
      margin: 4px auto 0;
      background: linear-gradient(90deg, rgba(220, 38, 38, 0) 0%, #dc2626 24%, #ff6b4a 50%, #dc2626 76%, rgba(220, 38, 38, 0) 100%);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.85);
      opacity: 0.92;
    }

    /* =====================================================================
       COMPACT RED 3-BUTTON VERTICAL PILL MENU ON LANDING PAGE (Pic 1 Style!)
       Play / Armory Shop / Settings — Maliit lang na box, sleek & animated!
       ===================================================================== */
    #landing-menu-stack {
      position: absolute;
      left: clamp(24px, 3.6vw, 56px);
      bottom: clamp(28px, 5.2vh, 56px);
      width: 268px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      z-index: 8;
      opacity: 0;
      transform: translate3d(-24px, 14px, 0) scale(0.94);
      pointer-events: none;
      transition:
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #landing-menu-stack.visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }

    .pill-btn {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0 18px;
      cursor: pointer;
      outline: none;
      text-align: left;
      transition:
        transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease;
    }
    .pill-btn:hover {
      transform: translateX(8px) scale(1.03);
    }
    .pill-btn:active {
      transform: translateX(4px) scale(0.97);
    }

    /* Primary Blood-Red "Play" Pill (Replaces Spawn) */
    .pill-play {
      height: 58px;
      border-radius: 20px 20px 10px 10px;
      border: 2px solid #2b0607;
      background: linear-gradient(180deg, #f03835 0%, #c81b1b 52%, #8e0f12 100%);
      color: #120202;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.82),
        0 0 26px rgba(220, 38, 38, 0.55),
        inset 0 2px 0 rgba(255, 195, 185, 0.55);
    }
    .pill-play:hover {
      background: linear-gradient(180deg, #ff4b45 0%, #dc2626 52%, #a61418 100%);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.88),
        0 0 38px rgba(239, 68, 68, 0.85),
        inset 0 2px 0 rgba(255, 220, 210, 0.72);
    }

    /* Translucent Deep Crimson Pills matching the red apocalyptic landing page (no flat black!) */
    .pill-dark {
      height: 48px;
      border-radius: 10px;
      border: 1.5px solid rgba(220, 56, 52, 0.65);
      background: linear-gradient(180deg, rgba(84, 16, 18, 0.82) 0%, rgba(40, 8, 10, 0.88) 100%);
      backdrop-filter: blur(6px);
      color: #ffffff;
      box-shadow:
        0 6px 18px rgba(24, 3, 4, 0.65),
        inset 0 1px 0 rgba(255, 160, 150, 0.25);
    }
    .pill-dark:last-of-type {
      border-radius: 10px 10px 18px 18px;
    }
    .pill-dark:hover {
      border-color: #ef4444;
      background: linear-gradient(180deg, rgba(145, 24, 26, 0.92) 0%, rgba(72, 12, 14, 0.95) 100%);
      box-shadow:
        0 8px 24px rgba(24, 3, 4, 0.78),
        0 0 24px rgba(220, 38, 38, 0.55);
    }

    .pill-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pill-divider {
      width: 1.5px;
      height: 54%;
      margin: 0 15px 0 13px;
      flex-shrink: 0;
    }
    .pill-play .pill-divider { background: rgba(255, 225, 215, 0.65); }
    .pill-dark .pill-divider { background: rgba(210, 185, 185, 0.45); }

    .pill-text {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .pill-play .pill-text { font-size: 1.55rem; }
    .pill-dark .pill-text { font-size: 1.2rem; }

    .engine-pill-status {
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(52, 10, 12, 0.72);
      border: 1px solid rgba(220, 56, 52, 0.45);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: #f3cbc5;
    }
    .engine-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      display: inline-block;
      margin-right: 6px;
    }
    .engine-dot.ready {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* =====================================================================
       COMPACT ANIMATED SPRING POP-UP BOX (Pic 4 Choose Mode -> Pic 5 Playstyle -> Shop/Settings)
       ===================================================================== */
    #popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 1, 2, 0.56);
      backdrop-filter: blur(3px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    #popup-backdrop.open {
      display: flex;
      animation: backdropFade 0.22s ease forwards;
    }
    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .popup-box {
      width: min(415px, 92vw);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(16, 10, 12, 0.97) 0%, rgba(8, 5, 7, 0.99) 100%);
      border: 1.5px solid rgba(220, 38, 38, 0.75);
      border-radius: 14px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.92),
        0 0 40px rgba(220, 38, 38, 0.28);
      overflow: hidden;
      transform-origin: center center;
      animation: springPopIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes springPopIn {
      0%   { opacity: 0; transform: scale(0.82) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Pic 4 & Pic 5 Signature Crimson Header: Icon + Title + Arrow Line + Red [X] */
    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(220, 38, 38, 0.28);
      background: rgba(24, 9, 11, 0.75);
    }
    .popup-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ef4444;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(220, 38, 38, 0.5);
    }
    .popup-arrow-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #dc2626 0%, #ef4444 100%);
      position: relative;
      margin: 0 4px;
    }
    .popup-arrow-line::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-top: 2px solid #ef4444;
      border-right: 2px solid #ef4444;
      transform: rotate(45deg);
    }
    .popup-close {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1.5px solid #3f0909;
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s ease, filter 0.16s ease;
    }
    .popup-close:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .popup-body {
      padding: 12px 14px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .popup-body::-webkit-scrollbar { width: 5px; }
    .popup-body::-webkit-scrollbar-thumb { background: rgba(220, 38, 38, 0.65); border-radius: 4px; }

    /* Pic 4 Compact Visual Mode Cards (OP // 01, 02, 03) */
    .mode-card {
      position: relative;
      border-radius: 10px;
      border: 1.5px solid rgba(160, 45, 45, 0.45);
      background: #140c0e;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      padding: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .mode-card:hover, .mode-card.active {
      transform: scale(1.02);
      border-color: #ef4444;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.36);
    }
    .mode-card-head {
      padding: 6px 11px;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(90deg, rgba(165, 22, 24, 0.92) 0%, rgba(70, 12, 14, 0.92) 100%);
    }
    .mode-card:not(.active):not(:hover) .mode-card-head {
      background: linear-gradient(90deg, rgba(28, 19, 21, 0.96) 0%, rgba(14, 10, 11, 0.96) 100%);
    }
    .mode-card-thumb {
      position: relative;
      width: 100%;
      height: 82px;
      overflow: hidden;
      background: #090506;
    }
    .mode-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }
    .mode-card:hover .mode-card-thumb img {
      transform: scale(1.06);
    }
    .mode-card-desc {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 4px 10px;
      background: linear-gradient(180deg, rgba(6, 2, 3, 0.1) 0%, rgba(6, 2, 3, 0.9) 100%);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: #f0d7d2;
    }

    /* Pic 5 Compact "> Option" Playstyle Rows (Easy / Medium / Hard) */
    .playstyle-meta {
      padding: 7px 11px;
      border-radius: 7px;
      background: rgba(120, 18, 22, 0.28);
      border: 1px solid rgba(220, 38, 38, 0.35);
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      color: #fca5a5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .role-row {
      width: 100%;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1.5px solid rgba(155, 50, 50, 0.42);
      background: linear-gradient(180deg, rgba(22, 15, 17, 0.96) 0%, rgba(10, 7, 8, 0.98) 100%);
      text-align: left;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .role-row:hover {
      transform: translateX(6px);
      border-color: #ef4444;
      background: linear-gradient(180deg, rgba(135, 22, 24, 0.92) 0%, rgba(56, 10, 12, 0.96) 100%);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35);
    }
    .role-row-title {
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: block;
    }
    .role-row-sub {
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: #e4c1bc;
      display: block;
      margin-top: 2px;
    }

    /* Compact Armory & Settings Controls inside Pop-Up Box */
    .compact-item {
      padding: 8px 11px;
      border-radius: 8px;
      background: rgba(24, 15, 17, 0.92);
      border: 1px solid rgba(185, 45, 45, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }
    .compact-btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid rgba(239, 68, 68, 0.65);
      background: linear-gradient(180deg, #dc2626 0%, #8f1114 100%);
      color: #ffffff;
      font-family: "Oswald", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.16s ease, filter 0.16s ease;
    }
    .compact-btn:hover { transform: scale(1.03); filter: brightness(1.12); }
    .compact-btn.secondary {
      background: rgba(26, 17, 19, 0.95);
      border-color: rgba(200, 90, 90, 0.45);
      color: #f0d4cf;
    }
    .compact-slider {
      width: 100%;
      accent-color: #ef4444;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Discreet Skip Trigger During Opening 8s */
    #skip-intro-btn {
      position: absolute;
      right: 22px;
      bottom: 20px;
      z-index: 9;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(8, 5, 6, 0.62);
      color: rgba(235, 212, 204, 0.85);
      font-family: "Oswald", sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.2em;
      padding: 6px 14px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.4s ease, border-color 0.2s ease, color 0.2s ease;
    }
    #skip-intro-btn:hover { border-color: rgba(239, 68, 68, 0.8); color: #ffffff; }
    #skip-intro-btn.hidden { opacity: 0; pointer-events: none; }

    /* =====================================================================
       UNITY 6 WEBGL FULLSCREEN GAME CONTAINER (PRELOADED SILENTLY BEHIND)
       ===================================================================== */
    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #060506;
      z-index: 10;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #060506;
      outline: none;
    }
    #fs-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 15;
      background: rgba(68, 12, 14, 0.78);
      border: 1px solid rgba(220, 52, 48, 0.72);
      color: #ffd0ca;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    #fs-btn:hover { background: rgba(185, 28, 28, 0.45); }
    #fs-btn.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- LIVE UNITY 6 WEBGL GAME CANVAS -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <button id="fs-btn" title="Toggle Fullscreen">⛶ FULLSCREEN</button>

  <!-- CINEMATIC 12-SECOND 60FPS HERO LANDING PAGE -->
  <section id="hero-stage" aria-label="DOOM Hell's Ascension Hero">
    <canvas id="cinematic-canvas"></canvas>
    <div class="hero-vignette"></div>

    <!-- Chiseled Metallic Blood-Red & Glowing Crimson SVG Title Typography -->
    <div id="hero-title-wrap">
      <svg class="title-svg" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DOOM HELL'S ASCENSION">
        <defs>
          <linearGradient id="doomRedMetal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff857a" />
            <stop offset="16%" stop-color="#ef4444" />
            <stop offset="48%" stop-color="#dc2626" />
            <stop offset="76%" stop-color="#991b1b" />
            <stop offset="100%" stop-color="#450a0a" />
          </linearGradient>
          <linearGradient id="doomBevelRim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fecaca" />
            <stop offset="30%" stop-color="#ef4444" />
            <stop offset="65%" stop-color="#7f1d1d" />
            <stop offset="100%" stop-color="#f87171" />
          </linearGradient>
          <linearGradient id="subCrimsonMetal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fca5a5" />
            <stop offset="45%" stop-color="#ef4444" />
            <stop offset="100%" stop-color="#991b1b" />
          </linearGradient>
          <linearGradient id="sheenSweep" x1="-30%" y1="0%" x2="10%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,220,200,0)" />
            <stop offset="50%" stop-color="rgba(255,215,195,0.42)" />
            <stop offset="100%" stop-color="rgba(255,220,200,0)" />
            <animate attributeName="x1" values="-40%;120%" dur="4.6s" repeatCount="indefinite" />
            <animate attributeName="x2" values="0%;160%" dur="4.6s" repeatCount="indefinite" />
          </linearGradient>
        </defs>
        <text x="600" y="138" text-anchor="middle" font-size="136" class="svg-main-doom" fill="#140203" stroke="#090102" stroke-width="10" transform="translate(0, 7)">DOOM</text>
        <text x="600" y="138" text-anchor="middle" font-size="136" class="svg-main-doom" fill="url(#doomRedMetal)" stroke="url(#doomBevelRim)" stroke-width="3.2">DOOM</text>
        <text x="600" y="138" text-anchor="middle" font-size="136" class="svg-main-doom" fill="url(#sheenSweep)">DOOM</text>
        <text x="600" y="202" text-anchor="middle" font-size="40" class="svg-sub-ascension" fill="#120203" stroke="#080102" stroke-width="5" transform="translate(0, 3)">HELL'S ASCENSION</text>
        <text x="600" y="202" text-anchor="middle" font-size="40" class="svg-sub-ascension" fill="url(#subCrimsonMetal)" stroke="rgba(254, 202, 202, 0.48)" stroke-width="1">HELL'S ASCENSION</text>
      </svg>
      <div class="title-flame-rule"></div>
    </div>

    <!-- COMPACT RED 3-BUTTON VERTICAL MENU STACK (Pic 1: Play / Armory Shop / Settings) -->
    <nav id="landing-menu-stack" aria-label="Main Menu">
      <button id="btn-menu-play" class="pill-btn pill-play">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#120202"><polygon points="5,3 20,12 5,21" /></svg>
        </span>
        <span class="pill-divider"></span>
        <span class="pill-text">Play</span>
      </button>

      <button id="btn-menu-shop" class="pill-btn pill-dark">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </span>
        <span class="pill-divider"></span>
        <span class="pill-text">Armory Shop</span>
      </button>

      <button id="btn-menu-settings" class="pill-btn pill-dark">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </span>
        <span class="pill-divider"></span>
        <span class="pill-text">Settings</span>
      </button>

      <div class="engine-pill-status">
        <span><i id="engine-dot" class="engine-dot"></i><span id="engine-status-text">LOADING ENGINE 0%</span></span>
        <span style="opacity:0.75">UNITY 6</span>
      </div>
    </nav>

    <button id="skip-intro-btn">SKIP TO MENU ▸</button>
  </section>

  <!-- COMPACT ANIMATED POP-UP BOXES (Choose Mode -> Choose Playstyle / Armory Shop / Settings) -->
  <div id="popup-backdrop" role="dialog" aria-modal="true">
    <div id="popup-box-root" class="popup-box"></div>
  </div>

  <script src="Build/WebGLBuild.loader.js"></script>
  <script>
    (() => {
      // =========================================================================
      // 1. 60FPS 12-SECOND CINEMATIC HERO CHOREOGRAPHY ENGINE
      // =========================================================================
      const heroStage = document.getElementById("hero-stage");
      const cineCanvas = document.getElementById("cinematic-canvas");
      const ctx = cineCanvas.getContext("2d", { alpha: false });
      const titleWrap = document.getElementById("hero-title-wrap");
      const menuStack = document.getElementById("landing-menu-stack");
      const skipBtn = document.getElementById("skip-intro-btn");
      const popupBackdrop = document.getElementById("popup-backdrop");
      const popupRoot = document.getElementById("popup-box-root");
      const engineDot = document.getElementById("engine-dot");
      const engineStatusText = document.getElementById("engine-status-text");

      const shotPaths = [
        "assets/hero/shot1_front.jpg",
        "assets/hero/shot2_turn.jpg",
        "assets/hero/shot3_pullback.jpg",
        "assets/hero/shot4_wide.jpg"
      ];
      const shots = shotPaths.map((src) => {
        const img = new Image();
        img.decoding = "async";
        img.src = src;
        return img;
      });

      let cw = 1920, ch = 1080;
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cw = Math.max(1, Math.floor(window.innerWidth * dpr));
        ch = Math.max(1, Math.floor(window.innerHeight * dpr));
        cineCanvas.width = cw;
        cineCanvas.height = ch;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      let targetMX = 0, targetMY = 0, curMX = 0, curMY = 0;
      window.addEventListener("mousemove", (e) => {
        targetMX = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
        targetMY = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
      });

      const smokePuffs = Array.from({ length: 16 }, (_, i) => ({
        x: Math.random(), y: 0.18 + Math.random() * 0.82, r: 0.16 + Math.random() * 0.24,
        vx: (i % 2 === 0 ? 1 : -1) * (0.008 + Math.random() * 0.014),
        vy: -(0.004 + Math.random() * 0.010), alpha: 0.06 + Math.random() * 0.10,
        crimson: i % 3 !== 0, phase: Math.random() * Math.PI * 2
      }));

      const embers = Array.from({ length: 90 }, () => ({
        x: Math.random(), y: Math.random(),
        vx: 0.012 + Math.random() * 0.036, vy: -(0.045 + Math.random() * 0.115),
        size: 1.4 + Math.random() * 3.8, phase: Math.random() * Math.PI * 2, hot: Math.random() > 0.35
      }));

      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const smooth = (t) => t * t * (3 - 2 * t);
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const lerp = (a, b, t) => a + (b - a) * t;

      function drawShotLayer(img, alpha, scale, panXNorm, panYNorm) {
        if (!img || !img.complete || img.naturalWidth === 0 || alpha <= 0.002) return;
        const imgAspect = img.naturalWidth / img.naturalHeight;
        const canAspect = cw / ch;
        let baseW, baseH;
        if (canAspect > imgAspect) { baseW = cw; baseH = cw / imgAspect; }
        else { baseH = ch; baseW = ch * imgAspect; }
        const drawW = baseW * scale;
        const drawH = baseH * scale;
        const dx = (cw - drawW) * 0.5 + panXNorm * cw - curMX * 14;
        const dy = (ch - drawH) * 0.5 + panYNorm * ch - curMY * 9;
        ctx.save();
        ctx.globalAlpha = clamp01(alpha);
        ctx.drawImage(img, dx, dy, drawW, drawH);
        ctx.restore();
      }

      let heroStartTime = performance.now();
      let heroActive = true;
      let titleShown = false;
      let menuShown = false;
      let lastFrameTs = heroStartTime;

      function resetCinematic(jumpToWide = false) {
        closePopup();
        heroStartTime = performance.now() - (jumpToWide ? 9400 : 0);
        if (!jumpToWide) {
          titleShown = false;
          menuShown = false;
          titleWrap.classList.remove("revealed");
          menuStack.classList.remove("visible");
          skipBtn.classList.remove("hidden");
        }
      }
      skipBtn.addEventListener("click", () => resetCinematic(true));

      function renderHero(now) {
        if (!heroActive) return;
        requestAnimationFrame(renderHero);

        const dt = Math.min(0.05, (now - lastFrameTs) / 1000);
        lastFrameTs = now;
        const elapsed = (now - heroStartTime) / 1000;

        curMX += (targetMX - curMX) * Math.min(1, dt * 4.5);
        curMY += (targetMY - curMY) * Math.min(1, dt * 4.5);

        ctx.fillStyle = "#040304";
        ctx.fillRect(0, 0, cw, ch);

        // 4-Shot Camera Choreography matching video_1.mp4
        const s1FadeOut = smooth(clamp01((elapsed - 2.3) / 1.35));
        const s1Prog = clamp01(elapsed / 3.6);
        drawShotLayer(shots[0], 1 - s1FadeOut, lerp(1.02, 1.11, s1Prog), lerp(0.0, 0.022, s1Prog), lerp(0.008, -0.006, s1Prog));

        const s2In = smooth(clamp01((elapsed - 2.2) / 1.35));
        const s2Out = smooth(clamp01((elapsed - 5.2) / 1.45));
        const s2Prog = clamp01((elapsed - 2.2) / 4.4);
        drawShotLayer(shots[1], s2In * (1 - s2Out), lerp(1.12, 1.03, easeOutCubic(s2Prog)), lerp(-0.024, 0.018, s2Prog), lerp(-0.004, 0.010, s2Prog));

        const s3In = smooth(clamp01((elapsed - 5.1) / 1.45));
        const s3Out = smooth(clamp01((elapsed - 8.0) / 1.55));
        const s3Prog = clamp01((elapsed - 5.1) / 4.5);
        drawShotLayer(shots[2], s3In * (1 - s3Out), lerp(1.20, 1.03, easeOutCubic(s3Prog)), lerp(0.014, -0.006, s3Prog), lerp(0.024, -0.004, s3Prog));

        const s4In = smooth(clamp01((elapsed - 7.9) / 1.6));
        const s4Pull = easeOutCubic(clamp01((elapsed - 7.9) / 4.3));
        const idleBreath = elapsed > 12.0 ? Math.sin((elapsed - 12.0) * 0.45) * 0.012 : 0;
        const idlePan = elapsed > 12.0 ? Math.sin((elapsed - 12.0) * 0.28) * 0.008 : 0;
        drawShotLayer(shots[3], s4In, lerp(1.18, 1.03, s4Pull) + idleBreath, idlePan, lerp(0.032, 0.0, s4Pull));

        // Live Volumetric Crimson Smoke & Embers
        const cityIntensity = clamp01((elapsed - 4.5) / 4.5);
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < smokePuffs.length; i++) {
          const p = smokePuffs[i];
          p.x = (p.x + p.vx * dt + 1.4) % 1.4 - 0.2;
          p.y = (p.y + p.vy * dt + 1.3) % 1.3 - 0.15;
          const px = p.x * cw, py = p.y * ch, rad = p.r * Math.max(cw, ch);
          const a = p.alpha * (0.78 + 0.22 * Math.sin(elapsed * 0.9 + p.phase)) * (0.65 + 0.55 * cityIntensity);
          const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
          g.addColorStop(0, p.crimson ? `rgba(185, 28, 28, ${a.toFixed(3)})` : `rgba(90, 26, 20, ${(a * 0.7).toFixed(3)})`);
          g.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = g;
          ctx.fillRect(px - rad, py - rad, rad * 2, rad * 2);
        }
        for (let i = 0; i < embers.length; i++) {
          const e = embers[i];
          e.x += (e.vx + Math.sin(elapsed * 2.1 + e.phase) * 0.015) * dt;
          e.y += e.vy * dt;
          if (e.y < -0.05) { e.y = 1.06; e.x = Math.random(); }
          if (e.x > 1.06) e.x = -0.05;
          if (e.x < -0.06) e.x = 1.05;
          const ex = e.x * cw, ey = e.y * ch;
          const flicker = 0.45 + 0.55 * Math.sin(elapsed * 6.5 + e.phase);
          const r = e.size * (cw / 1920) * (0.85 + 0.3 * flicker);
          const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 3.2);
          eg.addColorStop(0, e.hot ? `rgba(255, 224, 178, ${(0.95 * flicker).toFixed(3)})` : `rgba(249, 115, 22, ${(0.85 * flicker).toFixed(3)})`);
          eg.addColorStop(0.4, `rgba(239, 68, 68, ${(0.65 * flicker).toFixed(3)})`);
          eg.addColorStop(1, "rgba(220, 38, 38, 0)");
          ctx.fillStyle = eg;
          ctx.beginPath();
          ctx.arc(ex, ey, r * 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        if (!titleShown && elapsed >= 8.2) {
          titleShown = true;
          titleWrap.classList.add("revealed");
          skipBtn.classList.add("hidden");
        }
        if (!menuShown && elapsed >= 9.0) {
          menuShown = true;
          menuStack.classList.add("visible");
        }
      }
      requestAnimationFrame(renderHero);

      // =========================================================================
      // 2. COMPACT SPRING-ANIMATED POP-UP CONTROLLER (Pic 4 -> Pic 5 / Shop / Settings)
      // =========================================================================
      let selectedMode = "Campaign";
      let webAudioMuted = false;
      let webSensitivity = 1.0;
      let pendingLaunch = null;
      let pendingShopOpen = false;

      const pinSvg = `<svg viewBox="0 0 24 24" width="22" height="22" fill="#ef4444"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>`;

      function openPopupHtml(title, innerHtml) {
        popupRoot.style.animation = "none";
        popupRoot.innerHTML = `
          <div class="popup-header">
            ${pinSvg}
            <span class="popup-title">${title}</span>
            <span class="popup-arrow-line"></span>
            <button class="popup-close" id="popup-close-btn" title="Close">✕</button>
          </div>
          <div class="popup-body">${innerHtml}</div>
        `;
        popupBackdrop.classList.add("open");
        void popupRoot.offsetWidth;
        popupRoot.style.animation = "";
        document.getElementById("popup-close-btn").addEventListener("click", closePopup);
      }

      function closePopup() {
        popupBackdrop.classList.remove("open");
      }
      popupBackdrop.addEventListener("click", (e) => { if (e.target === popupBackdrop) closePopup(); });
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closePopup(); });

      // STEP 1 POP-UP: Pic 4 "Choose Mode" with Pic 3's 3 Modes
      function openChooseModePopup() {
        openPopupHtml("Choose Mode", `
          <button class="mode-card active" data-mode="Campaign">
            <div class="mode-card-head">&gt; OP // 01  CAMPAIGN (100 LEVELS)</div>
            <div class="mode-card-thumb">
              <img src="assets/hero/shot4_wide.jpg" alt="Campaign" />
              <div class="mode-card-desc">Sequential Level 1 → 100 · 10 Unique Realm Bosses · Acid Demons</div>
            </div>
          </button>
          <button class="mode-card" data-mode="EndlessHorde">
            <div class="mode-card-head">&gt; OP // 02  ENDLESS HORDE</div>
            <div class="mode-card-thumb">
              <img src="assets/hero/shot3_pullback.jpg" alt="Endless Horde" />
              <div class="mode-card-desc">Infinite Escalating Waves · Unique Realm Boss every 3rd Wave</div>
            </div>
          </button>
          <button class="mode-card" data-mode="PurgatoryBlitz">
            <div class="mode-card-head">&gt; OP // 03  PURGATORY BLITZ</div>
            <div class="mode-card-thumb">
              <img src="assets/hero/shot2_turn.jpg" alt="Purgatory Blitz" />
              <div class="mode-card-desc">150s Doomsday Clock (+2.5s / Kill) across unlocked levels</div>
            </div>
          </button>
        `);
        popupRoot.querySelectorAll(".mode-card").forEach((card) => {
          card.addEventListener("click", () => {
            selectedMode = card.getAttribute("data-mode");
            openChoosePlaystylePopup();
          });
        });
      }

      // STEP 2 POP-UP: Pic 5 "Choose Playstyle" -> Easy / Medium / Hard
      function openChoosePlaystylePopup() {
        const modeTitle = selectedMode === "Campaign" ? "OP // 01 CAMPAIGN"
                        : selectedMode === "EndlessHorde" ? "OP // 02 ENDLESS HORDE"
                        : "OP // 03 PURGATORY BLITZ";
        openPopupHtml("Choose Playstyle", `
          <div class="playstyle-meta">
            <span>MODE: ${modeTitle}</span>
            <span>${unityReady ? "READY TO DEPLOY" : "PRELOADING..."}</span>
          </div>
          <button class="role-row" data-diff="0.75">
            <span class="role-row-title">&gt; Easy</span>
            <span class="role-row-sub">0.75x Threat · Balanced Demon HP &amp; Acid Damage · New Slayers</span>
          </button>
          <button class="role-row" data-diff="1.0">
            <span class="role-row-title">&gt; Medium</span>
            <span class="role-row-sub">1.00x Threat · Standard Citadel Combat · Authentic DOOM Pace</span>
          </button>
          <button class="role-row" data-diff="1.45">
            <span class="role-row-title">&gt; Hard</span>
            <span class="role-row-sub">1.45x Threat · Brutal Acid Corrosion &amp; Relentless Bosses</span>
          </button>
          <div style="display:flex;justify-content:flex-start;margin-top:2px;">
            <button id="btn-back-modes" class="compact-btn secondary">← Back to Modes</button>
          </div>
        `);
        document.getElementById("btn-back-modes").addEventListener("click", openChooseModePopup);
        popupRoot.querySelectorAll(".role-row").forEach((row) => {
          row.addEventListener("click", () => {
            const diff = row.getAttribute("data-diff");
            launchIntoUnity(selectedMode, diff);
          });
        });
      }

      // COMPACT ARMORY SHOP POP-UP
      function openArmoryPopup() {
        openPopupHtml("Armory Shop", `
          <div class="compact-item"><span>REAVER VANDAL &amp; INFERNO PHANTOM</span><span style="color:#fca5a5">RIFLES [1-2]</span></div>
          <div class="compact-item"><span>HELL-JUDGE &amp; SOUL-SHREDDER ODIN</span><span style="color:#fca5a5">HEAVY [3-4]</span></div>
          <div class="compact-item"><span>REAVER OPERATOR SNIPER + SCOPE</span><span style="color:#fca5a5">SNIPER [5]</span></div>
          <div class="compact-item"><span>KARAMBIT / KATANA / CHAINSWORD + ABILITIES</span><span style="color:#fca5a5">[V] &amp; [X]</span></div>
          <button id="btn-enter-shop" class="compact-btn" style="width:100%;padding:11px;">
            ${unityReady ? "▶ OPEN LIVE ARMORY SHOP [B]" : "⏳ LOADING UNITY ARMORY..."}
          </button>
        `);
        document.getElementById("btn-enter-shop").addEventListener("click", () => {
          if (unityReady && unityInst) {
            closePopup();
            dismissHero();
            unityInst.SendMessage("GameManager", "OpenShopFromWeb", "");
          } else {
            pendingShopOpen = true;
            document.getElementById("btn-enter-shop").textContent = "⏳ LAUNCHING ONCE READY...";
          }
        });
      }

      // COMPACT SETTINGS POP-UP
      function openSettingsPopup() {
        openPopupHtml("Settings", `
          <div class="compact-item">
            <span>MASTER AUDIO &amp; GUN SFX</span>
            <button id="btn-set-audio" class="compact-btn ${webAudioMuted ? "secondary" : ""}">${webAudioMuted ? "MUTED" : "ENABLED"}</button>
          </div>
          <div class="compact-item" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;">
              <span>MOUSE AIM SENSITIVITY</span>
              <span id="sens-val-label" style="color:#fca5a5">${webSensitivity.toFixed(2)}x</span>
            </div>
            <input id="sens-slider" class="compact-slider" type="range" min="0.4" max="2.5" step="0.05" value="${webSensitivity}" />
          </div>
          <div class="compact-item">
            <span>CAMPAIGN PROGRESS</span>
            <button id="btn-set-reset" class="compact-btn secondary">RESET TO LVL 1</button>
          </div>
          <button id="btn-set-replay" class="compact-btn secondary" style="width:100%;">↻ REPLAY 12-SECOND HERO CINEMATIC</button>
          <div style="font-size:0.70rem;color:#c9a9a3;text-align:center;line-height:1.45;">
            [WASD] Move · [MOUSE] Aim · [LMB] Fire · [RMB] ADS/Scope · [1-5] Guns<br/>
            [R] Reload · [Y] Inspect · [V] Melee · [X] Ability · [SHIFT] Dash · [B] Shop
          </div>
        `);
        document.getElementById("btn-set-audio").addEventListener("click", (e) => {
          webAudioMuted = !webAudioMuted;
          e.target.textContent = webAudioMuted ? "MUTED" : "ENABLED";
          e.target.classList.toggle("secondary", webAudioMuted);
          syncWebSettingsToUnity();
        });
        document.getElementById("sens-slider").addEventListener("input", (e) => {
          webSensitivity = parseFloat(e.target.value);
          document.getElementById("sens-val-label").textContent = webSensitivity.toFixed(2) + "x";
          syncWebSettingsToUnity();
        });
        document.getElementById("btn-set-reset").addEventListener("click", (e) => {
          if (unityReady && unityInst) unityInst.SendMessage("GameManager", "ResetProgressFromWeb", "");
          e.target.textContent = "RESET DONE!";
        });
        document.getElementById("btn-set-replay").addEventListener("click", () => resetCinematic(false));
      }

      document.getElementById("btn-menu-play").addEventListener("click", openChooseModePopup);
      document.getElementById("btn-menu-shop").addEventListener("click", openArmoryPopup);
      document.getElementById("btn-menu-settings").addEventListener("click", openSettingsPopup);

      function syncWebSettingsToUnity() {
        if (unityReady && unityInst) {
          unityInst.SendMessage("GameManager", "ApplyWebSettings", `${webSensitivity.toFixed(2)}|${webAudioMuted ? 1 : 0}`);
        }
      }

      function dismissHero() {
        heroStage.classList.add("dismissed");
        setTimeout(() => { heroActive = false; }, 850);
      }

      function launchIntoUnity(mode, diff) {
        if (unityReady && unityInst) {
          closePopup();
          syncWebSettingsToUnity();
          dismissHero();
          unityInst.SendMessage("GameManager", "LaunchFromWebHero", `${mode}|${diff}`);
        } else {
          pendingLaunch = { mode, diff };
          openPopupHtml("Deploying...", `
            <div style="text-align:center;padding:18px 8px;">
              <div style="font-size:1.05rem;color:#fca5a5;margin-bottom:8px;">LOADING UNITY 6 ENGINE...</div>
              <div style="font-size:0.78rem;color:#c9a9a3;">Auto-deploying into <b>${mode}</b> as soon as preload finishes.</div>
            </div>
          `);
        }
      }

      // =========================================================================
      // 3. SEAMLESS BACKGROUND UNITY 6 WEBGL PRELOADER & HANDOFF
      // =========================================================================
      const unityCanvas = document.querySelector("#unity-canvas");
      const fsBtn = document.querySelector("#fs-btn");
      let unityReady = false;
      let unityInst = null;

      createUnityInstance(unityCanvas, {
        arguments: [],
        dataUrl: "Build/WebGLBuild.data",
        frameworkUrl: "Build/WebGLBuild.framework.js",
        codeUrl: "Build/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Markdhaniel Agcaoili",
        productName: "DOOM: HELL'S ASCENSION",
        productVersion: "2.3",
        matchWebGLToCanvasSize: true
      }, (progress) => {
        const pct = Math.min(100, Math.round(progress * 100));
        if (!unityReady) {
          engineStatusText.textContent = pct >= 90 ? `INITIALIZING ${pct}%` : `LOADING ENGINE ${pct}%`;
        }
      }).then((instance) => {
        unityInst = instance;
        unityReady = true;
        engineDot.classList.add("ready");
        engineStatusText.textContent = "ENGINE READY";
        syncWebSettingsToUnity();
        if (pendingLaunch) {
          const pl = pendingLaunch;
          pendingLaunch = null;
          launchIntoUnity(pl.mode, pl.diff);
        } else if (pendingShopOpen) {
          pendingShopOpen = false;
          closePopup();
          dismissHero();
          unityInst.SendMessage("GameManager", "OpenShopFromWeb", "");
        }
      }).catch((err) => {
        engineStatusText.textContent = "ENGINE ERROR";
        console.error(err);
      });

      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          if (unityInst) unityInst.SetFullscreen(1);
          else document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement) fsBtn.classList.add("hidden");
        else fsBtn.classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
